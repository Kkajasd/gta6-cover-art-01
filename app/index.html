<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Key Art — GTA 6 cover maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <h1>LEONIDA <span class="accent">KEY ART</span></h1>
  <p>Turn a photo into a GTA-style cover poster. Pick a photo, a layout, a grade — export the PNG.</p>
</header>
<main class="editor">
  <section class="preview-pane">
    <canvas id="preview" width="960" height="540" aria-label="Cover preview"></canvas>
    <div class="size-row" role="group" aria-label="Poster size">
      <label><input type="radio" name="size" value="16:9" checked> Wide 16:9</label>
      <label><input type="radio" name="size" value="1:1"> Square 1:1</label>
      <label><input type="radio" name="size" value="4:5"> Portrait 4:5</label>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">Loading…</p>
  </section>
  <aside class="controls">
    <section class="card">
      <h2>1 · Photo</h2>
      <button id="uploadBtn" class="primary">Upload your photo</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="row">
        <button id="sample1Btn">Boulevard sample</button>
        <button id="sample2Btn">Pier sample</button>
      </div>
      <label class="slider">Zoom
        <input type="range" id="zoomRange" min="1" max="2.5" step="0.05" value="1.1">
        <span id="zoomVal">1.10×</span>
      </label>
      <p class="hint">Drag the preview to pan the photo inside its panels.</p>
    </section>
    <section class="card">
      <h2>2 · Layout</h2>
      <div class="btn-row" id="layoutBtns"></div>
      <div id="panelList"></div>
    </section>
    <section class="card">
      <h2>3 · Grade</h2>
      <div class="btn-row" id="gradeBtns"></div>
    </section>
    <section class="card">
      <h2>4 · Words</h2>
      <label>Title <input type="text" id="titleInput" value="LEONIDA" maxlength="24"></label>
      <label>Caption <input type="text" id="captionInput" value="Welcome back to Vice City — the sun never sets on the score." maxlength="90"></label>
    </section>
    <section class="card">
      <h2>5 · Export</h2>
      <button id="autoBtn" class="primary" title="Pick the best layout and grade for the current photo">Auto-cover</button>
      <div class="row">
        <button id="exportSquare">1080×1080</button>
        <button id="exportPortrait">1080×1350</button>
        <button id="exportWide">1920×1080</button>
      </div>
    </section>
  </aside>
</main>
<script type="module" src="src/cover.js"></script>
<script type="module" src="src/shots.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
